name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * *"   # nightly, 9:00 UTC
  workflow_dispatch:       # adds a manual "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          HEADLESS: "1"
        run: pytest -v --html=report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html