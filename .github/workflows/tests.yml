name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * *"   # nightly, 9:00 UTC
  workflow_dispatch:       # adds a manual "Run workflow" button

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check --output-format github .

      - name: Check formatting
        run: ruff format --check .

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests/api -v --html=api-report.html --self-contained-html

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: api-report.html

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UI tests
        env:
          HEADLESS: "1"
        run: pytest tests/ui -v --html=ui-report.html --self-contained-html

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: ui-report.html

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

  # Publish the latest reports from main to GitHub Pages, whether the tests passed or failed
  publish-reports:
    needs: [api-tests, ui-tests]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download test reports
        uses: actions/download-artifact@v4
        # A test job that failed before uploading leaves no report; publish what exists
        continue-on-error: true
        with:
          pattern: "*-test-report"
          path: site
          merge-multiple: true

      - name: Build index page
        env:
          UI_RESULT: ${{ needs.ui-tests.result }}
          API_RESULT: ${{ needs.api-tests.result }}
        run: python3 .github/scripts/build_report_index.py site

      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4